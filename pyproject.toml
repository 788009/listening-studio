description = "Backend and frontend for generating English listening exercises"
requires-python = ">=3.10,<3.11"
dependencies = [
    "alembic>=1.14,<2",
    "authlib>=1.6,<2",
    "fastapi>=0.138.2,<0.139",
    "httpx>=0.28,<1",
    "imageio-ffmpeg>=0.6,<1",
    "itsdangerous>=2.2,<3",
    "loguru>=0.7,<1",
    "openai>=2.45,<3",
    "pydub>=0.25,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]
